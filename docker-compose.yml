# MySQL + phpMyAdmin + aplicación web para la práctica AEMET / proyecto Climate Change Analyzer.
# Uso:  docker compose up -d
# Author: Jaime Fano Alijarde
# Requiere un archivo .env (copia .env.example y ajusta las contraseñas).

services:
  db:
    image: mysql:8.4
    container_name: meteo_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # Los .sql de esta carpeta se ejecutan UNA vez, al crear el volumen por primera vez.
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  phpmyadmin:
    image: phpmyadmin:5
    container_name: meteo_phpmyadmin
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PMA_HOST: db
    ports:
      - "8080:80"

  # Aplicación web (PHP + Apache). Sirve web/public en http://localhost:8000
  web:
    build: ./web
    container_name: cca_web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db            # dentro de la red de Docker, la base de datos es "db"
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE}
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      # Recuperación de contraseña por email (ver SMTP_* en .env.example). Sin SMTP_HOST no se envían correos.
      APP_URL: ${APP_URL:-http://localhost:8000}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SEGURIDAD: ${SMTP_SEGURIDAD:-tls}
      SMTP_USUARIO: ${SMTP_USUARIO:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_REMITENTE: ${SMTP_REMITENTE:-}
    ports:
      - "8000:80"
    volumes:
      - ./web:/var/www/html

  # ETL (Node.js): descarga datos de AEMET y los guarda en MySQL.
  # Se queda en ejecución: actualiza al arrancar y después cada día a las HORA_ACTUALIZACION
  # (00:30 por defecto). La primera vez, con la base de datos vacía, carga el histórico completo.
  # Uso manual, además:
  #   docker compose run --rm etl node index.js          (histórico completo)
  #   docker compose run --rm etl npm run actualizar     (continuar desde la última lectura)
  etl:
    build: ./etl
    container_name: cca_etl
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env          # AEMET_API_KEY, HORA_ACTUALIZACION, HISTORICO_ANIOS, etc.
    environment:
      DB_HOST: db           # dentro de la red de Docker, la base de datos es "db"
      DB_PORT: 3306
      TZ: Europe/Madrid

volumes:
  mysql_data:
