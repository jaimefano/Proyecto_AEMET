<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <h1 class="h3 mb-3">Iniciar sesión</h1>

  {{#si errores}}
    <div class="alert alert-danger" role="alert">
      <ul class="mb-0">
        {{#cada errores}}<li>{{.}}</li>{{/cada}}
      </ul>
    </div>
  {{/si}}

    <form method="post" action="login.php">
      <input type="hidden" name="csrf" value="{{csrf}}">
      <div class="mb-3">
        <label for="nick" class="form-label">Nombre de usuario</label>
        <input type="text" class="form-control" id="nick" name="nick" value="{{nick}}" maxlength="30" required autofocus>
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Contraseña</label>
        <input type="password" class="form-control" id="password" name="password" required>
      </div>
      <button type="submit" class="btn btn-primary w-100">Entrar</button>
    </form>

    <p class="mt-3 mb-1"><a href="recuperar.php">¿Has olvidado tu contraseña?</a></p>
    <p>¿No tienes cuenta? <a href="registro.php">Regístrate</a></p>
  </div>
</div>
