<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <h1 class="h3 mb-3">Cambiar contraseña</h1>

  {{#si errores}}
    <div class="alert alert-danger" role="alert">
      <ul class="mb-0">
        {{#cada errores}}<li>{{.}}</li>{{/cada}}
      </ul>
    </div>
  {{/si}}

    <form method="post" action="cambiar_password.php">
      <input type="hidden" name="csrf" value="{{csrf}}">
      <div class="mb-3">
        <label for="actual" class="form-label">Contraseña actual</label>
        <input type="password" class="form-control" id="actual" name="actual" required autofocus>
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Contraseña nueva</label>
        <input type="password" class="form-control" id="password" name="password" minlength="6" maxlength="72" data-password required>
        <div class="form-text">Al menos 6 caracteres.</div>
      </div>
      <div class="mb-3">
        <label for="password2" class="form-label">Repite la contraseña nueva</label>
        <input type="password" class="form-control" id="password2" name="password2" data-password-repetir required>
      </div>
      <button type="submit" class="btn btn-primary">Cambiar contraseña</button>
      <a href="perfil.php" class="btn btn-link">Cancelar</a>
    </form>
    <p class="mt-3 text-muted small">¿No recuerdas la actual? Cierra la sesión y usa «¿Has olvidado tu contraseña?».</p>
  </div>
</div>
