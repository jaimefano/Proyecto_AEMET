<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <h1 class="h3 mb-3">Elegir una contraseña nueva</h1>

    {{#si tokenInvalido}}
      <div class="alert alert-danger" role="alert">
        Este enlace no es válido o ha caducado. Solicita uno nuevo.
      </div>
      <p><a class="btn btn-primary" href="recuperar.php">Solicitar otro enlace</a></p>
    {{/si}}

    {{#no tokenInvalido}}
  {{#si errores}}
    <div class="alert alert-danger" role="alert">
      <ul class="mb-0">
        {{#cada errores}}<li>{{.}}</li>{{/cada}}
      </ul>
    </div>
  {{/si}}

      <form method="post" action="restablecer.php">
        <input type="hidden" name="csrf" value="{{csrf}}">
        <input type="hidden" name="token" value="{{token}}">
        <div class="mb-3">
          <label for="password" class="form-label">Contraseña nueva</label>
          <input type="password" class="form-control" id="password" name="password" minlength="6" maxlength="72" data-password required autofocus>
          <div class="form-text">Al menos 6 caracteres.</div>
        </div>
        <div class="mb-3">
          <label for="password2" class="form-label">Repite la contraseña</label>
          <input type="password" class="form-control" id="password2" name="password2" data-password-repetir required>
        </div>
        <button type="submit" class="btn btn-primary w-100">Cambiar contraseña</button>
      </form>
    {{/no}}
  </div>
</div>
